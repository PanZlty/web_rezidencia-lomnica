name: Deploy MU Plugins

on:
  push:
    branches:
      - main
    paths:
      - "mu-plugins/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare MU plugins
        run: |
          rm -rf deploy-mu-plugins
          mkdir -p deploy-mu-plugins
          cp -R mu-plugins/. deploy-mu-plugins/
          find deploy-mu-plugins -maxdepth 3 -type f | sort

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Upload MU plugins to WordPress via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_TARGET: ${{ secrets.SFTP_TARGET }}
        run: |
          lftp -u "$SFTP_USERNAME","$SFTP_PASSWORD" -p "$SFTP_PORT" sftp://"$SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          set net:timeout 20
          set net:max-retries 2
          lcd deploy-mu-plugins
          mirror -R --only-newer --verbose ./ "$SFTP_TARGET"
          bye
          EOF
